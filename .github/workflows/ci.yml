# ============================================================
# Industrial AI Hub — CI（GitHub Actions）
# 门禁：任意 PR / main 推送 → 后端构建+89 测试（H2 隔离，无需本机 MySQL）
#       + 前端 npm ci + build。全绿才允许合并（配合分支保护）。
# 详见 docs/decision-log/0018-ci-and-test-isolation.md
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — JDK 25 + mvnw test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & Test（H2 隔离，无外部依赖）
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend — Node 22 + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================================
  # Migration integrity guard（ADR 0019 §5.5 的补偿措施）
  # 背景：ignore-migration-patterns: "*:missing" 会容忍「已应用迁移文件被删除」，
  #       为避免未来误删/重命名正式 migration 被静默放过，PR 必须保证：
  #       任何"已存在于目标分支"的 db/migration/*.sql 不得被删除(D)或重命名(R)。
  # 职责边界：只拦 D/R；新增(A)/内容修改(M) 不拦（M 由 Flyway checksum/validate 负责）。
  # ============================================================
  migration-integrity:
    name: Migration integrity — no published migration deleted/renamed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — published Flyway migrations must not be deleted or renamed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice::no base SHA (manual dispatch) — skip migration integrity check"
            exit 0
          fi
          echo "base=${BASE_SHA}"
          echo "head=${HEAD_SHA}"
          CHANGES="$(git diff --name-status "${BASE_SHA}...${HEAD_SHA}" -- 'backend/src/main/resources/db/migration/*.sql' 2>/dev/null || true)"
          if [ -z "$CHANGES" ]; then
            echo "no changes under db/migration"
            exit 0
          fi
          printf '%s\n' "$CHANGES"
          if printf '%s\n' "$CHANGES" | grep -qE '^(D|R[0-9]+)'; then
            echo "::error::a published Flyway migration was deleted (D) or renamed (R) — this breaks existing DB schema history; add a NEW V###__*.sql instead"
            exit 1
          fi
          echo "migration changes are additions/modifications only — OK"
