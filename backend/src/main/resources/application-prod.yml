# ========================
# Industrial AI Hub — Production Profile
# ========================

logging:
  level:
    dev.reboot: WARN
    # SSE 是长连接状态机，连接建立/移除日志量低但对排障必要。
    dev.reboot.controller.InspectionPushController: INFO
    dev.reboot.mq.SseEmitterRegistry: INFO
    org.springframework: WARN

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

server:
  tomcat:
    max-connections: 500
    threads:
      max: 200
