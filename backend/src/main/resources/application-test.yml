# ========================
# Industrial AI Hub — Test Profile
# ========================

jwt:
  secret: test-secret-for-context-load-at-least-256-bits
  expiration-ms: 86400000

spring:
  # 测试环境完全隔离：不读取本地 .env，密钥一律使用占位隔离值
  # DB 隔离（ADR 0018）：H2 内存库（MODE=MySQL），测试零外部依赖，无需本机 MySQL
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: test-password-for-context-load
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  sql:
    init:
      mode: never

logging:
  level:
    dev.reboot: WARN
    org.springframework: WARN
