# ========================
# Industrial AI Hub — Test Profile
# ========================

jwt:
  secret: test-secret-for-context-load-at-least-256-bits
  expiration-ms: 86400000

spring:
  # 测试环境完全隔离：不读取本地 .env，密钥一律使用占位隔离值
  # DB 隔离（ADR 0018）：H2 内存库（MODE=MySQL），测试零外部依赖，无需本机 MySQL
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: test-password-for-context-load
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # Spring AI 仅启用 Chat（DeepSeekConfig 显式 Bean）；其余 OpenAI 自动配置未配置
      # spring.ai.openai.api-key 时启动失败，统一排除（ADR 0022）
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # MCP Server 默认关闭（隔离测试上下文）；McpServerContextTest 单独启用验证
      - org.springframework.ai.mcp.server.autoconfigure.McpServerAutoConfiguration
      - org.springframework.ai.mcp.server.autoconfigure.McpWebMvcServerAutoConfiguration
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration
  sql:
    init:
      mode: never

logging:
  level:
    dev.reboot: WARN
    org.springframework: WARN

deepseek:
  enabled: false
  api-key: test-deepseek-key-not-used
  base-url: https://api.deepseek.com
  model: deepseek-chat
