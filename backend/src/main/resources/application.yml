# ========================
# Industrial AI Hub — Spring Boot Config
# Version: v3.1 | Updated: 2026-08-16
# 密钥来源（见 AGENTS.md §8 / docs/decision-log/0015）：
#   dev  : 根目录 .env（application-dev.yml 经 spring.config.import 读取），OS 环境变量可覆盖
#   test : application-test.yml 隔离密钥（不读 .env）
#   prod : 容器环境变量注入（compose.yml），不依赖本地 .env
# 敏感变量（MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET）一律不提供默认值：
# 缺失即启动失败（fail-fast），禁止静默退化为空字符串。
# ========================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # Spring AI 仅启用 Chat（DeepSeekConfig 显式 Bean）；Embedding/Image/Audio/Moderation
      # 自动配置会在未配置 spring.ai.openai.api-key 时启动失败，统一排除（ADR 0022）
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # 本项目固定 WebMVC 传输；排除 WebFlux MCP 自动配置，避免双路由注册（ADR 0027）
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 正式迁移目录：只存放 schema 变更 + 必需初始化（V1 baseline / V3 ...）。
    # 演示/测试种子数据已移出迁移链（原 V2__seed_test_data.sql 退役）：
    # 开发环境经 scripts/seed-dev.sh 显式灌入 db/seed/dev/seed_demo_data.sql（幂等），
    # 生产环境启动时不会自动产生 Demo 数据（见 ADR 0019）。
    locations: classpath:db/migration
    # 既有库（非空且无 flyway_schema_history）基线到 V2，跳过 V1 重放（V2 已退役，等价于跳过 V1）；全新空库从 V1 开始
    baseline-on-migrate: true
    baseline-version: 2
    # 容忍"已执行过旧 V2"的既有库（flyway_schema_history 含 V2 行但文件已不存在）：
    # 没有该配置时，Flyway validate 会以 "applied migration not resolved locally: 2" 失败。
    # 仅放行 missing 状态，其余校验（checksum/description 等）保持默认严格。
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
  ai:
    mcp:
      server:
        enabled: true
        name: industrial-ai-hub-mcp
        version: 1.0.0
        type: sync
        stdio: false
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        tool-change-notification: false
        resource-change-notification: false
        prompt-change-notification: false
        instructions: >-
          Industrial AI Hub 只读设备查询服务。工具返回 JSON；
          当前仅对内部可信 AI 客户端开放，请勿将端点暴露到公网。

app:
  mcp:
    # 传输层共享令牌（ADR 0029）：配置后 /mcp/* 要求 X-MCP-Token 一致；
    # 留空表示本机/内网可信场景不启用令牌校验（本地开发默认）。
    access-token: ${MCP_ACCESS_TOKEN:}
    client:
      # 进程内 MCP 客户端冒烟连接目标（默认指向本服务）。
      base-url: ${MCP_CLIENT_BASE_URL:http://localhost:8080}
      sse-endpoint: ${MCP_CLIENT_SSE_ENDPOINT:/mcp/sse}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name:industrial-ai-hub}
    distribution:
      # Day 103：为 HTTP 请求开启延迟直方图 → Prometheus 产出 http_server_requests_seconds_bucket，
      # 才能算 p95/p99（Day 102 压测发现只有 count/sum，分位数只能靠 JMeter 原始采样）
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

# ========================
# 通用接口限流（Day 37 引入，Day 103 按压测结果加固）
# ========================
rate:
  limit:
    # 每个参数化路径（数字段归一化为 {id}）独立的令牌桶速率
    permits: ${RATE_LIMIT_PERMITS:50}
    # 拿不到令牌时的等待上限（毫秒）：500 = 保持 Day 37 以来行为（有界背压队列，
    # 把一部分本该拒绝的突发请求转为「稍慢但成功」；占用线程数上界 ≈ permits×timeout ≈ 25）。
    # 置 0 = 立即 429、不排队（延迟可预测，但牺牲突发容忍度）。
    # Day 102 按响应码拆分实测：429 路径 avg 0.9ms/p99 3ms（从不阻塞），等待只发生在被放行的 200 上。
    acquire-timeout-ms: ${RATE_LIMIT_ACQUIRE_TIMEOUT_MS:500}
    # 拒绝日志节流窗口：每窗口每路径最多一行（含窗口内抑制条数）；0 = 不节流（排障用）。
    # Day 102 实测未节流时 30s 突发写 146,077 行 ≈ 23.2MB 日志。
    log-interval-ms: ${RATE_LIMIT_LOG_INTERVAL_MS:5000}

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    dev.reboot: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ========================
# DeepSeek AI（Phase 4，OpenAI 兼容）
# 默认关闭：未配置 API Key 不影响核心服务启动；
# 启用后密钥 SSOT 为根目录 .env（DEEPSEEK_API_KEY，见 ADR 0021）
# ========================
deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  # ADR 0015 §8.3：敏感变量禁止空默认，未配置时 fail-fast（运行时才需，启动不强制，业务 ensureAvailable 兜底 503）
  api-key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}
  temperature: 0.3

# ========================
# RAG 知识库（Week 11，ADR 0024）
# 第一版使用离线哈希向量 + 内存向量库；后续替换真实 embedding 与 Qdrant。
# ========================
rag:
  embedding-dimensions: 256
  chunk-size: 500
  chunk-overlap: 50

# ========================
# 注册治理（P1-02-A-3）
# enabled=false（默认）：POST /api/auth/register 返回 403（统一错误语义）
# enabled=true：必须携带与 invite-code 匹配的邀请码；每日注册上限 daily-limit（Redis 计数）
# invite-code 建议经环境注入（dev 由 .env 的 REGISTER_INVITE_CODE 提供；prod 由容器环境注入）
# ========================
security:
  registration:
    enabled: false
    invite-code: ${REGISTER_INVITE_CODE:}
    daily-limit: 100

# ========================
# MQTT Listener（Phase 5 Day 96，ADR 0034）
# 默认关闭：没有 EMQX 的开发/测试环境不建连；
# 容器化/联调时经环境变量注入 MQTT_ENABLED=true + MQTT_HOST=emqx（compose.yml v1.4）。
# ========================
mqtt:
  enabled: ${MQTT_ENABLED:false}
  host: ${MQTT_HOST:127.0.0.1}
  port: ${MQTT_PORT:1883}
  client-id: ${MQTT_CLIENT_ID:iah-backend-mqtt}
  topic-filter: plc/+/+/telemetry
  qos: 1
  clean-session: true
  keep-alive-seconds: 60
  connection-timeout-seconds: 10
