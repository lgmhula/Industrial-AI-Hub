# ========================
# Industrial AI Hub — Spring Boot Config
# ========================

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1zxcvbnm
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis —— 注解 Mapper（code/）+ XML Mapper（mapper/）
mybatis:
  mapper-locations:
    - classpath:code/**/*Mapper.xml
    - classpath:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Logging
logging:
  level:
    dev.reboot: DEBUG
