# ========================
# Industrial AI Hub — Spring Boot Config
# Version: v3.1 | Updated: 2026-08-16
# 密钥来源（见 AGENTS.md §8 / docs/decision-log/0015）：
#   dev  : 根目录 .env（application-dev.yml 经 spring.config.import 读取），OS 环境变量可覆盖
#   test : application-test.yml 隔离密钥（不读 .env）
#   prod : 容器环境变量注入（compose.yml），不依赖本地 .env
# 敏感变量（MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET）一律不提供默认值：
# 缺失即启动失败（fail-fast），禁止静默退化为空字符串。
# ========================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # Spring AI 仅启用 Chat（DeepSeekConfig 显式 Bean）；Embedding/Image/Audio/Moderation
      # 自动配置会在未配置 spring.ai.openai.api-key 时启动失败，统一排除（ADR 0022）
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # 本项目固定 WebMVC 传输；排除 WebFlux MCP 自动配置，避免双路由注册（ADR 0027）
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 正式迁移目录：只存放 schema 变更 + 必需初始化（V1 baseline / V3 ...）。
    # 演示/测试种子数据已移出迁移链（原 V2__seed_test_data.sql 退役）：
    # 开发环境经 scripts/seed-dev.sh 显式灌入 db/seed/dev/seed_demo_data.sql（幂等），
    # 生产环境启动时不会自动产生 Demo 数据（见 ADR 0019）。
    locations: classpath:db/migration
    # 既有库（非空且无 flyway_schema_history）基线到 V2，跳过 V1 重放（V2 已退役，等价于跳过 V1）；全新空库从 V1 开始
    baseline-on-migrate: true
    baseline-version: 2
    # 容忍"已执行过旧 V2"的既有库（flyway_schema_history 含 V2 行但文件已不存在）：
    # 没有该配置时，Flyway validate 会以 "applied migration not resolved locally: 2" 失败。
    # 仅放行 missing 状态，其余校验（checksum/description 等）保持默认严格。
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
  ai:
    mcp:
      server:
        enabled: true
        name: industrial-ai-hub-mcp
        version: 1.0.0
        type: sync
        stdio: false
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        tool-change-notification: false
        resource-change-notification: false
        prompt-change-notification: false
        instructions: >-
          Industrial AI Hub 只读设备查询服务。工具返回 JSON；
          当前仅对内部可信 AI 客户端开放，请勿将端点暴露到公网。

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    dev.reboot: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ========================
# DeepSeek AI（Phase 4，OpenAI 兼容）
# 默认关闭：未配置 API Key 不影响核心服务启动；
# 启用后密钥 SSOT 为根目录 .env（DEEPSEEK_API_KEY，见 ADR 0021）
# ========================
deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  # ADR 0015 §8.3：敏感变量禁止空默认，未配置时 fail-fast（运行时才需，启动不强制，业务 ensureAvailable 兜底 503）
  api-key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:30}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}
  temperature: 0.3

# ========================
# RAG 知识库（Week 11，ADR 0024）
# 第一版使用离线哈希向量 + 内存向量库；后续替换真实 embedding 与 Qdrant。
# ========================
rag:
  embedding-dimensions: 256
  chunk-size: 500
  chunk-overlap: 50

# ========================
# 注册治理（P1-02-A-3）
# enabled=false（默认）：POST /api/auth/register 返回 403（统一错误语义）
# enabled=true：必须携带与 invite-code 匹配的邀请码；每日注册上限 daily-limit（Redis 计数）
# invite-code 建议经环境注入（dev 由 .env 的 REGISTER_INVITE_CODE 提供；prod 由容器环境注入）
# ========================
security:
  registration:
    enabled: false
    invite-code: ${REGISTER_INVITE_CODE:}
    daily-limit: 100
