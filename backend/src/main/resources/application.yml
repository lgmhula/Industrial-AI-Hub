# ========================
# Industrial AI Hub — Spring Boot Config
# Version: v2.0 | Updated: 2026-08-03
# Active profile: dev (default), set SPRING_PROFILES_ACTIVE=prod for production
# ========================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# Actuator 最小暴露：仅 health（Dockerfile HEALTHCHECK 依赖），不暴露细节
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  mapper-locations: classpath*:code/**/*Mapper.xml, classpath*:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    dev.reboot: INFO
