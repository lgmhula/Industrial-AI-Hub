# ========================
# Industrial AI Hub — Spring Boot Config
# Version: v1.3
# Updated: 2026-07-24
# ========================

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1zxcvbnm}
    driver-class-name: com.mysql.cj.jdbc.Driver

# ========================
# JWT 密钥统一走环境变量 JWT_SECRET / JWT_EXPIRATION_MS
# 不在此处配置，避免硬编码
# ========================

# MyBatis
mybatis:
  mapper-locations: classpath*:code/**/*Mapper.xml, classpath*:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Logging
logging:
  level:
    dev.reboot: DEBUG
