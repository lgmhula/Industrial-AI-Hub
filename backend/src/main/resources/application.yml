# ========================
# Industrial AI Hub — Spring Boot Config
# Version: v3.1 | Updated: 2026-08-16
# 密钥来源（见 AGENTS.md §8 / docs/decision-log/0015）：
#   dev  : 根目录 .env（application-dev.yml 经 spring.config.import 读取），OS 环境变量可覆盖
#   test : application-test.yml 隔离密钥（不读 .env）
#   prod : 容器环境变量注入（compose.yml），不依赖本地 .env
# 敏感变量（MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET）一律不提供默认值：
# 缺失即启动失败（fail-fast），禁止静默退化为空字符串。
# ========================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/reboot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: dev.reboot.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    dev.reboot: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
