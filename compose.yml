# ========================
# industrial ai hub — unified docker compose
# Version: v1.2 | Updated: 2026-08-03
# Infrastructure Baseline V2 (backend app service added)
# ========================

networks:
  industrial-network:
    driver: bridge
    name: industrial-network

services:

  # ==========================================
  # MySQL 8.4 — Primary Database
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - industrial-network

  # ==========================================
  # Redis Stack 7.4 — Cache & Modules
  # ==========================================
  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - industrial-network

  # ==========================================
  # RabbitMQ 4.0 — Message Broker
  # ==========================================
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - industrial-network

  # ==========================================
  # Nacos 2.4 — Service Registry & Config
  # ==========================================
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
    volumes:
      - ./nacos:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - industrial-network

  # ==========================================
  # MinIO — Object Storage
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - industrial-network

  # ==========================================
  # Elasticsearch 8.x — Search Engine
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - industrial-network

  # ==========================================
  # MySQL Master-Slave — Read/Write Splitting
  # ==========================================
  mysql-master:
    image: mysql:8.4
    container_name: mysql-master
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_MS_ROOT_PASSWORD}
      MYSQL_DATABASE: reboot
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/ms-conf/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./mysql/ms-data/master:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_MS_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - industrial-network

  mysql-slave1:
    image: mysql:8.4
    container_name: mysql-slave1
    restart: unless-stopped
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_MS_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/ms-conf/slave1.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - ./mysql/ms-data/slave1:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_MS_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - industrial-network

  mysql-slave2:
    image: mysql:8.4
    container_name: mysql-slave2
    restart: unless-stopped
    ports:
      - "13308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_MS_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/ms-conf/slave2.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - ./mysql/ms-data/slave2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_MS_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - industrial-network

  # ==========================================
  # Redis Sentinel — High Availability (x3)
  # ==========================================
  redis-sentinel1:
    image: redis/redis-stack:7.4.0-v1
    container_name: redis-sentinel1
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - industrial-network

  redis-sentinel2:
    image: redis/redis-stack:7.4.0-v1
    container_name: redis-sentinel2
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "26380:26379"
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - industrial-network

  redis-sentinel3:
    image: redis/redis-stack:7.4.0-v1
    container_name: redis-sentinel3
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "26381:26379"
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - industrial-network

  # ==========================================
  # Backend — Spring Boot Application (Baseline V2.1)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: industrial-ai-hub-backend:latest
    container_name: iah-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 容器网络内使用服务名 mysql + 容器内端口 3306
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - industrial-network

# Named volumes (managed by Docker, not bind-mounted)
volumes:
  rabbitmq-data:
