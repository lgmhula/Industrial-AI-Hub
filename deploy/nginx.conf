# ==========================================
# Industrial AI Hub — Nginx 反向代理
# 放置到: /etc/nginx/sites-available/industrial-ai-hub
# 启用: sudo ln -s /etc/nginx/sites-available/industrial-ai-hub /etc/nginx/sites-enabled/
# ==========================================

upstream backend {
    server 127.0.0.1:8080;
    # 多实例负载均衡（Day 62 扩展）
    # server 127.0.0.1:8081;
    # server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name industrial-ai-hub.example.com;

    # 前端静态资源（Vue3 构建产物）
    root /var/www/industrial-ai-hub/dist;
    index index.html;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（AI 分析接口可能较慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Actuator 健康检查（不对外暴露）
    location = /actuator/health {
        proxy_pass http://backend;
        allow 127.0.0.1;
        deny all;
    }

    # 前端 SPA 路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
