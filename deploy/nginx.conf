# ==========================================
# Industrial AI Hub — Nginx 生产配置
# 功能：静态资源 + 负载均衡 + HTTPS
# 放置到: /etc/nginx/sites-available/industrial-ai-hub
# 启用: sudo ln -s /etc/nginx/sites-available/industrial-ai-hub /etc/nginx/sites-enabled/
# ==========================================

# ── 后端负载均衡（多实例） ──
upstream backend {
    # 默认轮询 round-robin
    server 127.0.0.1:8080 weight=3;
    server 127.0.0.1:8081 weight=1;
    # 会话保持（可选，JWT 无状态通常不需要）
    # ip_hash;
    # 最少连接（适合长连接场景）
    # least_conn;
}

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name industrial-ai-hub.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS 主服务 ──
server {
    listen 443 ssl http2;
    server_name industrial-ai-hub.example.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/industrial-ai-hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industrial-ai-hub.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── gzip 压缩 ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端静态资源（Vue3 构建产物）
    root /var/www/industrial-ai-hub/dist;
    index index.html;

    # ── 后端 API 反向代理 ──
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（AI 分析接口较慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Actuator 健康检查（仅本机）
    location = /actuator/health {
        proxy_pass http://backend;
        allow 127.0.0.1;
        deny all;
    }

    # 前端 SPA 路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可安全 immutable）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
