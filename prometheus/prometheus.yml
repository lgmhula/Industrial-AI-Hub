# Industrial AI Hub — Prometheus 抓取配置（Day 100, ADR 0036）
# 抓取宿主机 Spring Boot 后端的 /actuator/prometheus（dev：后端跑在宿主机 :8080）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: industrial-ai-hub-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # 容器化部署后端（compose backend 服务）后取消注释：
  # - job_name: industrial-ai-hub-backend-container
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["backend:8080"]
