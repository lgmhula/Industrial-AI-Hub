# Industrial AI Hub — Prometheus 抓取配置（Day 100, ADR 0036）
# 双部署模式并存观测（Day 104 编排）：
#   · industrial-ai-hub-backend          → 宿主机模式（dev：后端跑在宿主机 :8080）
#   · industrial-ai-hub-backend-container → 容器模式（compose backend 服务 :8080）
# 哪种模式在线哪个 target up，无需改配置切换。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: industrial-ai-hub-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: industrial-ai-hub-backend-container
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
