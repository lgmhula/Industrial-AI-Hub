## RabbitMQ 4.0 — Phase 3-A 启动配置（最小化基线）
##
## 设计约束（G7: 遵循 T1 运行时隔离原则）：
##   1. 本文件由 Git 管理（.gitignore !rabbitmq/rabbitmq.conf 例外规则）
##   2. 运行时数据（mnesia/cookie）由 named volume rabbitmq-data 管理
##   3. 禁止在此声明 nodename——容器 hostname 由 Docker 分配，
##      声明固定 nodename 会导致配置解析失败（RMQ 4.0 prelaunch crash）
##
## cookie 权限问题已通过 named volume 解决：
##   容器内 chmod 600 .erlang.cookie 在 Docker managed volume 中生效，
##   不再受 macOS bind-mount POSIX 权限缺陷影响。
##
## 生效条件：docker compose up（compose.yml 挂载为 /etc/rabbitmq/rabbitmq.conf:ro）

log.console.level = info
